name: Build Fork APK

on:
  push:
    branches:
      - feature/**
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-android 接受 SDK 许可需要 JDK 17+；AGP 7.2.2 也能在 JDK 17 上运行。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Chaquopy (Python 插件) 在项目评估阶段会读取 local.properties，缺失会导致
      # "Failed to notify project evaluation listener" 报错，即使只构建 java flavor。
      - name: Create local.properties with SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 生成的 APK 依然按 app/build.gradle 的 minSdk 19 (java flavor)，可装 Android 4.4+。
      # --add-opens 兜底解决 AGP 7.x 在 JDK 17 上偶发的模块访问限制。
      - name: Build debug APK (java flavor, minSdk 19 / Android 4.4+)
        run: ./gradlew assembleJavaDebug --stacktrace --warning-mode all
        env:
          JAVA_TOOL_OPTIONS: >-
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.util=ALL-UNNAMED
            --add-opens=java.base/java.io=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-java-debug-android4.4plus
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn

      # 生成一个发布用签名密钥库（自测/个人使用）。如需正式发布，可换成你自己的 keystore。
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/tvbox-release.jks \
            -alias tvbox \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tvbox123 -keypass tvbox123 \
            -dname "CN=TVBox, OU=Dev, O=TVBox, L=NA, ST=NA, C=CN"

      - name: Configure signing properties
        run: |
          {
            echo "RELEASE_STORE_FILE=./tvbox-release.jks"
            echo "RELEASE_STORE_PASSWORD=tvbox123"
            echo "RELEASE_KEY_ALIAS=tvbox"
            echo "RELEASE_KEY_PASSWORD=tvbox123"
          } >> gradle.properties

      - name: Build release APK (java flavor, minSdk 19 / Android 4.4+, signed + minified)
        run: ./gradlew assembleJavaRelease --stacktrace --warning-mode all
        env:
          JAVA_TOOL_OPTIONS: >-
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.util=ALL-UNNAMED
            --add-opens=java.base/java.io=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-java-release-android4.4plus
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: warn
